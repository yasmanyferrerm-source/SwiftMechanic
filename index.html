<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>SwiftMechanic</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="icon-btn" id="backBtn" hidden aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
      </button>
      <h1 id="title">SwiftMechanic</h1>
    </header>
    <main id="view"></main>
    <nav class="tabbar" id="tabbar">
      <button data-tab="diagnose" class="active">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z" /></svg>
        <span>Diagnose</span>
      </button>
      <button data-tab="garage">
        <svg viewBox="0 0 24 24"><path d="M5 17h14M6 17l1.5-5h9L18 17M7.5 12l1.2-3.5h6.6L16.5 12" /><circle cx="8" cy="17" r="1.6" /><circle cx="16" cy="17" r="1.6" /></svg>
        <span>Garage</span>
      </button>
      <button data-tab="codes">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="12" rx="2" /><path d="M8 9h3M8 12h6M9 20h6" /></svg>
        <span>Codes</span>
      </button>
      <button data-tab="history">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 8v4l3 2" /></svg>
        <span>History</span>
      </button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" /></svg>
        <span>Settings</span>
      </button>
    </nav>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
